<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Redirecting to The Rampage...</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
                background-size: 400% 400%;
                animation: gradientBG 15s ease infinite;
                color: white;
                font-family: Arial, sans-serif;
                text-align: center;
            }

            .loader {
                width: 50px;
                height: 50px;
                border: 5px solid rgba(255, 255, 255, 0.2);
                border-radius: 50%;
                border-top-color: #fff;
                animation: spin 1s ease-in-out infinite;
                margin: 20px auto;
            }

            @keyframes gradientBG {
                0% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
                100% {
                    background-position: 0% 50%;
                }
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .content {
                padding: 20px;
                max-width: 80%;
            }
        </style>
    </head>
    <body>
        <div class="content">
            <h1>Welcome to The Rampage</h1>
            <p>
                Sorry. We moved our website(again). Redirecting you to our new
                site... Or go there yourself:
                <a
                    href="https://rampage.is-great.org"
                    style="color: #4cc9f0; text-decoration: none"
                    >rampage.is-great.org</a
                >
            </p>
            <div class="loader"></div>
            <p>
                If you are not redirected automatically,
                <a
                    href="https://rampage.is-great.org"
                    style="color: #4cc9f0; text-decoration: none"
                    >click here</a
                >.
            </p>
        </div>

        <script>
            // Redirect after a short delay to allow animation to be seen
            setTimeout(function () {
                window.location.href = "https://rampage.is-great.org";
            }, 200); // 200ms delay
        </script>
    </body>
</html>
